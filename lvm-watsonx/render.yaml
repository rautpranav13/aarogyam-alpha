services:
  - type: web
    name: aarogyam-lvm-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn flask_app.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_URL
        value: https://eu-de.ml.cloud.ibm.com
      - key: IMAGE_FETCH_TIMEOUT
        value: "10"
