services:
  - type: web
    name: aarogyam-firstaid-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app --timeout 60
    envVars:
      - key: COS_API_KEY_ID
        sync: false
      - key: COS_INSTANCE_CRN
        sync: false
      - key: COS_ENDPOINT
        value: https://s3.ap.cloud-object-storage.appdomain.cloud
      - key: BUCKET_NAME
        value: aarogyamfirstaid
