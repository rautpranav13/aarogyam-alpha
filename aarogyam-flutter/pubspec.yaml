name: aarogyam
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core
  provider: ^6.1.2
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  flutter_dotenv: ^5.2.1

  # Firebase
  firebase_core: 3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_performance: ^0.10.0+10

  # Google / Apple sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  crypto: ^3.0.5
  path: ^1.9.0

  # UI / theming
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.9.1
  cached_network_image: ^3.4.1
  auto_size_text: ^3.0.0
  flutter_card_swiper: ^6.0.0
  flutter_staggered_grid_view: ^0.7.0
  dropdown_button2: ^2.3.9
  expandable: ^5.0.1
  emoji_flag_converter: ^1.1.0

  # HTML rendering
  flutter_html: ^3.0.0-beta.2
  flutter_html_table: ^3.0.0-beta.2

  # HTTP / networking
  http: ^1.3.0

  # Media
  audioplayers: ^6.0.0
  record: ^5.2.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Storage / DB
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # Permissions / notifications
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  collection: ^1.18.0
  rxdart: ^0.27.7
  equatable: ^2.0.5
  from_css_color: ^2.0.0
  json_path: ^0.7.2
  cross_file: ^0.3.4+2
  stream_transform: ^2.1.0
  mime_type: ^1.0.0
  csslib: ^0.17.3
  html: ^0.15.4
  device_info_plus: ^10.1.2
  flutter_keyboard_visibility: ^6.0.0
  flutter_cache_manager: ^3.4.1

  # Splash
  flutter_native_splash: ^2.4.3

  cupertino_icons: ^1.0.0
  google_mlkit_text_recognition: ^0.13.0
  flutter_tts: ^4.2.5

dependency_overrides:
  intl: ^0.19.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  lints: ^4.0.0
  image: ^4.2.0
  fake_cloud_firestore: ^3.0.2
  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: 'assets/images/app_launcher_icon.jpg'


flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
    - assets/sqlite_db_files/

  fonts:
    - family: 'Samarkan'
      fonts:
        - asset: assets/fonts/Samarkan_Normal.ttf
    - family: 'KCS'
      fonts:
        - asset: assets/fonts/Devanagari-KCS.ttf
    - family: 'Sam'
      fonts:
        - asset: assets/fonts/SAMAN___.TTF
