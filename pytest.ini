[pytest]
# Run each service's tests independently to avoid sys.modules 'app' name collisions:
#   pytest rag-chatBot/tests/ -v
#   pytest lvm-watsonx/tests/ -v
#   pytest firstaid-object-storage/tests/ -v
#
# Or run all at once with importlib isolation:
#   pytest rag-chatBot/tests/ lvm-watsonx/tests/ firstaid-object-storage/tests/ -v --import-mode=importlib
addopts = --import-mode=importlib
